<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Скеля">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Скеля</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Компактна панель таймера: з'являється, коли великий таймер прокручено -->
  <div id="mini" class="mini glass-float" aria-hidden="true">
    <svg class="mini-ring" viewBox="0 0 36 36" aria-hidden="true">
      <circle cx="18" cy="18" r="15" class="track" />
      <circle cx="18" cy="18" r="15" class="arc" id="miniArc" />
    </svg>
    <span class="mini-time" id="miniTime">00:00</span>
    <span class="muted mini-total" id="miniTotal"></span>
    <button class="btn-pearl sm" data-action="done">Готово</button>
  </div>

  <main class="app">
    <header class="top">
      <span id="date"></span>
      <span id="count"></span>
    </header>

    <section class="hero" id="hero">
      <!-- Порожній стан: Скеля і голографічні наліпки, що повільно «дихають» -->
      <div class="calm" id="calm" hidden>
        <svg viewBox="0 0 260 210" aria-hidden="true">
          <defs>
            <!-- Голографічна плівка, що повільно переливається -->
            <linearGradient id="holo" x1="0" y1="0" x2=".55" y2=".55" spreadMethod="reflect">
              <stop offset="0" stop-color="#C6F6E2" />
              <stop offset=".2" stop-color="#D9C9FF" />
              <stop offset=".4" stop-color="#FFC7E7" />
              <stop offset=".6" stop-color="#FFE6B5" />
              <stop offset=".8" stop-color="#BDE9FF" />
              <stop offset="1" stop-color="#C6F6E2" />
              <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="10s" repeatCount="indefinite" />
            </linearGradient>
            <!-- Відблиск, що пробігає по наліпці -->
            <linearGradient id="sheen" x1="0" y1="0" x2="1" y2=".3">
              <stop offset="0" stop-color="#fff" stop-opacity="0" />
              <stop offset=".42" stop-color="#fff" stop-opacity="0" />
              <stop offset=".5" stop-color="#fff" stop-opacity=".8" />
              <stop offset=".58" stop-color="#fff" stop-opacity="0" />
              <stop offset="1" stop-color="#fff" stop-opacity="0" />
              <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;1 0" keyTimes="0;.55;1" dur="6s" repeatCount="indefinite" />
            </linearGradient>
            <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".6" />
            </filter>
            <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="24" /></filter>

            <!-- Силуети вирубки: товстий контур навколо малюнка -->
            <g id="cutRock"><path d="M38 168 L100 78 L124 106 L158 56 L222 168 Z" /></g>
            <g id="cutSun"><circle cx="214" cy="40" r="10" /><path d="M214 24v5M214 51v5M198 40h5M225 40h5M202.7 28.7l3.5 3.5M221.8 47.8l3.5 3.5M202.7 51.3l3.5-3.5M221.8 32.2l3.5-3.5" /></g>
            <g id="cutCup"><path d="M28 60h18v10a7 7 0 0 1-7 7h-4a7 7 0 0 1-7-7z" /><path d="M46 63h3a3.5 3.5 0 0 1 0 7h-3M34 54q2-3 0-6M41 54q2-3 0-6" /></g>
            <g id="cutLaptop"><rect x="200" y="124" width="26" height="17" rx="2.5" /><path d="M195 146h36" /></g>
            <g id="cutStar"><path d="M44 126 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" /></g>
          </defs>

          <g filter="url(#soft)">
            <circle class="blob b1" cx="90" cy="110" r="46" fill="#2F7DFF" />
            <circle class="blob b2" cx="175" cy="95" r="40" fill="#FF4FD8" />
            <circle class="blob b3" cx="130" cy="150" r="34" fill="#A78BFF" />
          </g>

          <!-- Гора-Скеля -->
          <g class="rock">
            <use href="#cutRock" fill="url(#holo)" stroke="url(#holo)" stroke-width="16" stroke-linejoin="round" filter="url(#drop)" />
            <use href="#cutRock" fill="url(#sheen)" stroke="url(#sheen)" stroke-width="16" stroke-linejoin="round" />
            <g fill="none" stroke="#17171A" stroke-linecap="round" stroke-linejoin="round">
              <path d="M38 168 L100 78 L124 106 L158 56 L222 168 Z" stroke-width="3" />
              <path d="M88 96 L100 78 L113 93 M146 74 L158 56 L171 76" stroke-width="2.6" />
              <path d="M62 168 L128 130 L178 168" stroke-width="2.2" />
            </g>
          </g>

          <!-- Наліпки -->
          <g class="st s1">
            <use href="#cutSun" fill="url(#holo)" stroke="url(#holo)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#drop)" />
            <use href="#cutSun" fill="url(#sheen)" stroke="url(#sheen)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
            <g fill="none" stroke="#17171A" stroke-width="2" stroke-linecap="round">
              <circle cx="214" cy="40" r="7" />
              <path d="M214 25v3M214 52v3M199 40h3M226 40h3M203.4 29.4l2.2 2.2M222.4 48.4l2.2 2.2M203.4 50.6l2.2-2.2M222.4 31.6l2.2-2.2" />
            </g>
          </g>
          <g class="st s2">
            <use href="#cutCup" fill="url(#holo)" stroke="url(#holo)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#drop)" />
            <use href="#cutCup" fill="url(#sheen)" stroke="url(#sheen)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
            <g fill="none" stroke="#17171A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M28 60h18v10a7 7 0 0 1-7 7h-4a7 7 0 0 1-7-7z" />
              <path d="M46 63h3a3.5 3.5 0 0 1 0 7h-3M34 54q2-3 0-6M41 54q2-3 0-6" />
            </g>
          </g>
          <g class="st s3">
            <use href="#cutLaptop" fill="url(#holo)" stroke="url(#holo)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#drop)" />
            <use href="#cutLaptop" fill="url(#sheen)" stroke="url(#sheen)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
            <g fill="none" stroke="#17171A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="200" y="124" width="26" height="17" rx="2.5" />
              <path d="M195 146h36M210 132.5h6" />
            </g>
          </g>
          <g class="st s4">
            <use href="#cutStar" fill="url(#holo)" stroke="url(#holo)" stroke-width="10" stroke-linejoin="round" filter="url(#drop)" />
            <use href="#cutStar" fill="url(#sheen)" stroke="url(#sheen)" stroke-width="10" stroke-linejoin="round" />
            <path d="M44 129 l2 5.5 5.5 2 -5.5 2 -2 5.5 -2 -5.5 -5.5 -2 5.5 -2z" fill="#17171A" />
          </g>
        </svg>
      </div>
      <div class="ring" id="ringBox">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="100" cy="100" r="93" class="track" />
          <circle cx="100" cy="100" r="93" class="arc" id="arc" />
        </svg>
        <div class="ring-center">
          <span class="ring-time" id="ringTime">—</span>
          <span class="ring-sub" id="ringSub"></span>
        </div>
      </div>
      <div class="actions" id="heroActions"></div>
    </section>

    <section class="plan" id="planSection">
      <div class="plan-head">
        <h2>План на сьогодні</h2>
        <span id="free"></span>
      </div>
      <div class="plan-meta">
        <button class="link" data-action="settings" id="hours"></button>
      </div>
      <button class="nudge" id="nudge" data-action="add-learn" hidden>
        <span>Сьогодні ще немає навчання</span><b>+ 1 год</b>
      </button>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <div class="dock">
  <nav class="tabbar glass-float" aria-label="Навігація">
    <button class="tab on" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
      <span>Сьогодні</span>
    </button>
    <button class="tab" data-action="soon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17M11 6h9M11 12h9M11 18h9" /></svg>
      <span>Задачі</span>
    </button>
    <button class="tab" data-action="soon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5" /><rect x="14" y="4" width="6" height="6" rx="1.5" /><rect x="4" y="14" width="6" height="6" rx="1.5" /><rect x="14" y="14" width="6" height="6" rx="1.5" /></svg>
      <span>Челенджі</span>
    </button>
    <button class="tab" data-action="soon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-6" /></svg>
      <span>Прогрес</span>
    </button>
  </nav>
  <button class="fab glass-float" data-action="menu" aria-label="Додати">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
  </button>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="sheet glass-float" id="sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
